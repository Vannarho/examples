name: VRE Python Wheel-Only Examples

on:
  workflow_dispatch:
    inputs:
      wheel_asset:
        description: macOS arm64 wheel asset name to validate
        required: false
        default: vannarho_risk_engine-0.14.0-cp313-cp313-macosx_26_0_arm64.whl
  push:
    branches:
      - main
    paths:
      - vre_python/**
      - .github/workflows/vre-python-wheel-only.yml
  pull_request:
    paths:
      - vre_python/**
      - .github/workflows/vre-python-wheel-only.yml

jobs:
  wheel-only-examples:
    # The currently published wheel set is macOS arm64 only.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      VRE_RELEASE_REPO: ${{ github.repository }}
      VRE_RELEASE_TAG: vre-python-v0.14.0
      VRE_WHEEL_ASSET: ${{ github.event.inputs.wheel_asset || 'vannarho_risk_engine-0.14.0-cp313-cp313-macosx_26_0_arm64.whl' }}
      VRE_WHEEL_ASSET_CP314: vannarho_risk_engine-0.14.0-cp314-cp314-macosx_26_0_arm64.whl
      VRE_PYTHON_EXAMPLE_SKIP: notebooks/example_10/run_sacva_larger_portfolio.py,notebooks/example_11/run_sacva_eqcom.py,notebooks/example_11/run_sacva_eqcom_fd.py,notebooks/example_11/run_sacva_eqcom_fd_aad.py
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        env:
          GH_TOKEN: ${{ secrets.VRE_RELEASE_TOKEN || github.token }}
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r vre_python/requirements.txt
          mkdir -p wheelhouse
          gh -R "$VRE_RELEASE_REPO" release download "$VRE_RELEASE_TAG" \
            -p "$VRE_WHEEL_ASSET" \
            -D wheelhouse
          gh -R "$VRE_RELEASE_REPO" release download "$VRE_RELEASE_TAG" \
            -p "$VRE_WHEEL_ASSET_CP314" \
            -D wheelhouse
          .venv/bin/python -m pip install --no-deps "wheelhouse/$VRE_WHEEL_ASSET"
          rm -rf .jupyter-kernels
          .venv/bin/python -m ipykernel install \
            --prefix "$GITHUB_WORKSPACE/.jupyter-kernels" \
            --name vre-wheel-313 \
            --display-name "VRE wheel cp313"

      - name: Prepare clean examples tree
        run: |
          VRE_EXAMPLES_DIR="$RUNNER_TEMP/vre_python_clean"
          echo "VRE_EXAMPLES_DIR=$VRE_EXAMPLES_DIR" >> "$GITHUB_ENV"
          rm -rf "$VRE_EXAMPLES_DIR"
          mkdir -p "$VRE_EXAMPLES_DIR"
          rsync -a \
            --exclude '__pycache__' \
            --exclude '.ipynb_checkpoints' \
            --exclude '.wheel_runtime_*.toml' \
            --exclude 'Output' \
            --exclude 'output' \
            "$GITHUB_WORKSPACE/vre_python/" \
            "$VRE_EXAMPLES_DIR/"

      - name: Prove installed wheel import
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from pathlib import Path
          import importlib.metadata as metadata
          import VRE, VREData, vre
          print("version", metadata.version("vannarho-risk-engine"))
          for name, module in [("VRE", VRE), ("VREData", VREData), ("vre", vre)]:
              path = Path(module.__file__).resolve()
              print(name, path)
              assert "site-packages" in path.parts or "dist-packages" in path.parts
              assert "build" not in path.parts
          PY

      - name: Prove Python 3.14 wheel import
        run: |
          command -v python3.14
          python3.14 -m venv .venv314
          .venv314/bin/python -m pip install --upgrade pip
          .venv314/bin/python -m pip install --no-deps "wheelhouse/$VRE_WHEEL_ASSET_CP314"
          cd /tmp
          "$GITHUB_WORKSPACE/.venv314/bin/python" - <<'PY'
          from pathlib import Path
          import importlib.metadata as metadata
          import VRE, VREData, vre
          print("version", metadata.version("vannarho-risk-engine"))
          for name, module in [("VRE", VRE), ("VREData", VREData), ("vre", vre)]:
              path = Path(module.__file__).resolve()
              print(name, path)
              assert "site-packages" in path.parts or "dist-packages" in path.parts
              assert "build" not in path.parts
          PY

      - name: Prove local VRE shadow is rejected
        run: |
          SHADOW="$RUNNER_TEMP/vre_shadow"
          rm -rf "$SHADOW"
          mkdir -p "$SHADOW/vre"
          printf 'SENTINEL = "local VRE shadow"\n' > "$SHADOW/VRE.py"
          printf 'SENTINEL = "local VREData shadow"\n' > "$SHADOW/VREData.py"
          printf 'SENTINEL = "local vre package shadow"\n' > "$SHADOW/vre/__init__.py"

          set +e
          PYTHONPATH="$SHADOW" "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$VRE_EXAMPLES_DIR/example_scripts/log.py" \
            > "$RUNNER_TEMP/vre_shadow_script.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            cat "$RUNNER_TEMP/vre_shadow_script.log"
            echo "Expected standalone script to reject PYTHONPATH VRE shadow"
            exit 1
          fi
          grep -E "outside the installed vannarho-risk-engine wheel|must import VRE from the installed" \
            "$RUNNER_TEMP/vre_shadow_script.log"

          set +e
          (
            cd "$VRE_EXAMPLES_DIR/notebooks/example_1"
            env PYTHONPATH="$SHADOW" VRE_PYBIND_FORCE_BUILD_DIR= VRE_PYBIND_BUILD_DIR= VRE_NOTEBOOK_BUILD_ROOT= \
              "$GITHUB_WORKSPACE/.venv/bin/python" -m nbconvert \
                --to notebook \
                --execute hello.ipynb \
                --output-dir "$RUNNER_TEMP/vre_shadow_notebook" \
                --ExecutePreprocessor.kernel_name=vre-wheel-313 \
                --ExecutePreprocessor.startup_timeout=180 \
                --ExecutePreprocessor.timeout=180
          ) > "$RUNNER_TEMP/vre_shadow_notebook.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            cat "$RUNNER_TEMP/vre_shadow_notebook.log"
            echo "Expected notebook to reject PYTHONPATH VRE shadow"
            exit 1
          fi
          grep -E "outside the installed vannarho-risk-engine wheel|must import VRE from the installed" \
            "$RUNNER_TEMP/vre_shadow_notebook.log"

      - name: Run aggregate examples
        run: |
          cd "$VRE_EXAMPLES_DIR"
          env PYTHONPATH= VRE_PYBIND_FORCE_BUILD_DIR= VRE_PYBIND_BUILD_DIR= VRE_NOTEBOOK_BUILD_ROOT= \
            "$GITHUB_WORKSPACE/.venv/bin/python" run.py

      - name: Execute notebooks
        run: |
          set -e
          export JUPYTER_PATH="$GITHUB_WORKSPACE/.jupyter-kernels/share/jupyter"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m jupyter kernelspec list
          BASE="$VRE_EXAMPLES_DIR/notebooks"
          OUT="$RUNNER_TEMP/vre_notebook_exec"
          for rel in \
            example_1/hello.ipynb \
            example_1/vre.ipynb \
            example_2/vre.ipynb \
            example_3/vre.ipynb \
            example_4/vre.ipynb \
            example_6/vre.ipynb \
            example_7/vre.ipynb \
            example_8/vre.ipynb \
            example_9/vre.ipynb \
            example_10/vre.ipynb
          do
            mkdir -p "$OUT/$(dirname "$rel")"
            (
              cd "$BASE/$(dirname "$rel")"
              env PYTHONPATH= VRE_PYBIND_FORCE_BUILD_DIR= VRE_PYBIND_BUILD_DIR= VRE_NOTEBOOK_BUILD_ROOT= \
                "$GITHUB_WORKSPACE/.venv/bin/python" -m nbconvert \
                  --to notebook \
                  --execute "$(basename "$rel")" \
                  --output-dir "$OUT/$(dirname "$rel")" \
                  --ExecutePreprocessor.kernel_name=vre-wheel-313 \
                  --ExecutePreprocessor.startup_timeout=180 \
                  --ExecutePreprocessor.timeout=1800
            )
          done
