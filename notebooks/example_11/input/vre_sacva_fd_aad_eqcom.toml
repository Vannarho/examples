[setup]
baseCurrency = "EUR"
asofDate = "2019-02-25"
runScopeId = "VREBasel::LE_VREPY_NOTEBOOK"
runScopeVersion = "legacy"
inputPath = "input_bundle/vre_sacva_fd_aad_eqcom"
outputPath = "Output/sacva_fd_aad_eqcom"
logFile = "log_fd_aad_eqcom.txt"
logMask = "15"
marketDataFile = "market_20190225.txt"
fixingDataFile = "fixings_20190225.txt"
implyTodaysFixings = "N"
curveConfigFile = "runtime_policy/resolved_curve_configuration.json"
conventionsFile = "reference_registry/convention_manifest.json"
marketConfigFile = "runtime_policy/resolved_todays_market.json"
pricingEnginesFile = "runtime_policy/pricingengine/resolved_pricing_policy.json"
portfolioFile = "portfolio_sacva_eqcom.xml"
counterpartyFile = "runtime_policy/resolved_counterparty_information.json"
legalEntityMasterFile = "runtime_policy/resolved_legal_entity_master.json"
nettingSetManagerFile = "runtime_policy/resolved_netting_set_information.json"
observationModel = "Disable"
scriptLibrary = "scriptlibrary_master.xml"
referenceDataFile = "reference_registry/resolved_reference_data.json"
nThreads = "1"

[markets]
lgmcalibration = "default"
fxcalibration = "default"
pricing = "default"
simulation = "default"
sensitivity = "default"

[analytics]
[analytics.npv]
active = "Y"
baseCurrency = "EUR"
outputFileName = "npv.csv"

[analytics.cashflow]
active = "Y"
outputFileName = "flows.csv"

[analytics.simulation]
active = "Y"
enableScenarioXva = "Y"
amc = "Y"
amcCg = "Full"
xvaCgSensitivityConfigFile = "runtime_policy/xva_cg_sensitivity/resolved_sensitivity.json"
xvaCgBumpSensis = "false"
amcTradeTypes = "ScriptedTrade"
simulationConfigFile = "runtime_policy/resolved_simulation.json"
pricingEnginesFile = "runtime_policy/pricingengine/resolved_pricing_policy.json"
amcPricingEnginesFile = "runtime_policy/pricingengine_amc/resolved_pricing_policy.json"
amcCgPricingEnginesFile = "runtime_policy/pricingengine_amccg/resolved_pricing_policy.json"
baseCurrency = "EUR"
flipViewXVA = "false"

storeSurvivalProbabilities = "Y"
[analytics.xva]
active = "Y"
csaFile = "runtime_policy/resolved_netting_set_information.json"
cubeFile = "cube.csv"
scenarioFile = "scenariodata.csv"
baseCurrency = "EUR"
exposureProfiles = "Y"
exposureProfilesByTrade = "Y"
quantile = "0.95"
calculationType = "NoLag"
cva = "Y"
dva = "N"
dvaName = "BANK"
rawCubeOutputFile = "rawcube.csv"
netCubeOutputFile = "netcube.csv"
dim = "N"
dimModel = "Regression"
dimRegressors = ""
dimQuantile = "0.99"
dimHorizonCalendarDays = "14"
dimRegressionOrder = "2"

[analytics.xvaSensitivity]
active = "Y"
marketConfigFile = "runtime_policy/scenario_market_profile.json"
sensitivityConfigFile = "runtime_policy/sensitivity/resolved_sensitivity.json"
sensiSource = "CG_AAD"
parSensitivity = "N"
outputSensitivityThreshold = "0.000001"
outputJacobi = "N"

csaFile = "runtime_policy/resolved_netting_set_information.json"
[analytics.saccr]
active = "N"
saccrBaseCurrency = "EUR"

saccrCcr3PortfolioClassificationFile = "runtime_policy/saccr_ccr3_portfolio_classification.csv"
saccrCcr3PortfolioVersion = "PHASE1_DATE_ROLL"
[analytics.sacva]
active = "Y"
saCvaMethod = "SACVA"
saCvaExposureMethod = "AUTO"
cvaExecutionMode = "Regulatory"
useUnhedgedCvaSensis = "N"
sacvaFxOrientation = "EURUSD"
