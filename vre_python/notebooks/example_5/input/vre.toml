[setup]
asofDate = "2023-01-31"
inputPath = "input_bundle/vre"
outputPath = "Output"
logFile = "log.txt"
logMask = "15"
marketDataFile = "market.txt"
fixingDataFile = "fixings.txt"
implyTodaysFixings = "N"
curveConfigFile = "runtime_policy/resolved_curve_configuration.json"
conventionsFile = "reference_registry/convention_manifest.json"
marketConfigFile = "runtime_policy/resolved_todays_market.json"
pricingEnginesFile = "runtime_policy/pricingengine/resolved_pricing_policy.json"
portfolioFile = "tarf_exposure.xml"
scriptLibrary = "scriptlibrary.xml"
observationModel = "None"

[markets]
lgmcalibration = "inccy"
fxcalibration = "default"
infcalibration = "inccy"
pricing = "default"
simulation = "default"
sensitivity = "default"

[analytics]
[analytics.npv]
active = "Y"
baseCurrency = "USD"
outputFileName = "npv.csv"
additionalResults = "true"

[analytics.additionalResults]
active = "Y"
outputFileName = "additional_results.csv"

[analytics.cashflow]
active = "Y"
outputFileName = "flows.csv"

[analytics.curves]
active = "Y"
configuration = "default"
grid = "240,1M"
outputFileName = "curves.csv"

[analytics.simulation]
active = "Y"
amc = "Y"
amcTradeTypes = "ScriptedTrade"
simulationConfigFile = "runtime_policy/resolved_simulation.json"
pricingEnginesFile = "runtime_policy/pricingengine/resolved_pricing_policy.json"
amcPricingEnginesFile = "runtime_policy/pricingengine/resolved_pricing_policy.json"
baseCurrency = "USD"
storeScenarios = "N"
cubeFile = "cube.dat"
aggregationScenarioDataFileName = "scenariodata.dat"
aggregationScenarioDataDump = "scenariodata.csv"

[analytics.xva]
active = "Y"
csaFile = "runtime_policy/resolved_netting_set_information.json"
cubeFile = "cube.dat"
scenarioFile = "scenariodata.dat"
baseCurrency = "USD"
exposureProfiles = "Y"
exposureProfilesByTrade = "Y"
quantile = "0.95"
calculationType = "Symmetric"
allocationMethod = "None"
marginalAllocationLimit = "1.0"
exerciseNextBreak = "N"
cva = "N"
dva = "N"
dvaName = "BANK"
fva = "N"
fvaBorrowingCurve = "USD-SOFR"
fvaLendingCurve = "USD-SOFR"
colva = "N"
collateralSpread = "0.0000"
collateralFloor = "N"
dim = "N"
dimQuantile = "0.99"
dimHorizonCalendarDays = "14"
dimRegressionOrder = "2"
dimRegressors = ""
dimScaling = "1.0"
dimEvolutionFile = "dim_evolution.csv"
dimRegressionFiles = "dim_regression.txt"
dimOutputNettingSet = "CPTY_A"
dimOutputGridPoints = "0"
dimLocalRegressionEvaluations = "0"
dimLocalRegressionBandwidth = "1.0"
rawCubeOutputFile = "rawcube.csv"
netCubeOutputFile = "netcube.csv"
